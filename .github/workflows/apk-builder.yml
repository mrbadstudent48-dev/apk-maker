name: Generate APK
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      app_name:
        required: true
      icon_url:
        required: true
      package_name:
        required: true
      version:
        required: true
      splash_color:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Cordova
        run: npm install -g cordova
      - name: Create App
        run: |
          cordova create app "${{ github.event.inputs.package_name }}" "App"
          cd app
          cordova platform add android
          wget -O icon.png "${{ github.event.inputs.icon_url }}"
          
          # ========================================================
          # অফিশিয়াল ErrorUrl পেজ তৈরি (Application Error পপ-আপ বন্ধ করবে)
          # ========================================================
          cat << 'EOF' > www/offline.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>No Internet</title>
            <style>
              body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f8fafc;color:#333;text-align:center;padding:20px;}
              .icon{font-size:60px;margin-bottom:15px;}
              h2{margin:0 0 10px;color:#0f172a;}
              p{margin:0 0 25px;color:#64748b;font-size:15px;}
              button{background:#4f46e5;color:#fff;border:none;padding:12px 25px;border-radius:8px;font-size:16px;font-weight:bold;box-shadow:0 4px 6px rgba(79,70,229,0.3);transition:0.2s;}
              button:active{transform:scale(0.95);}
            </style>
          </head>
          <body>
            <div class="icon">📶❌</div>
            <h2>No Internet Connection</h2>
            <p>Please check your wifi or mobile data and try again.</p>
            <button onclick="window.location.href='${{ github.event.inputs.url }}'">Retry Connection</button>
            
            <script>
               // ডাটা অন করার সাথে সাথেই অটোমেটিক সাইটে নিয়ে যাবে
               window.addEventListener('online', function() {
                   window.location.href = '${{ github.event.inputs.url }}';
               });
            </script>
          </body>
          </html>
          EOF
          # ========================================================
          
          sed -i 's|<name>App</name>|<name>${{ github.event.inputs.app_name }}</name>|g' config.xml
          
          # এখানে আমরা সরাসরি ওয়েবসাইটের লিংকই দিব
          sed -i 's|<content src="index.html" />|<content src="${{ github.event.inputs.url }}" />|g' config.xml
          sed -i 's|version="1.0.0"|version="${{ github.event.inputs.version }}"|g' config.xml
          
          # ম্যাজিক: ErrorUrl এর ভ্যালু হিসেবে শুধু offline.html দেওয়া হলো!
          sed -i "s|</widget>|    <icon src=\"icon.png\" />\n    <allow-navigation href=\"*\" />\n    <preference name=\"Fullscreen\" value=\"true\" />\n    <preference name=\"AndroidWindowSplashScreenAnimatedIcon\" value=\"icon.png\" />\n    <preference name=\"AndroidWindowSplashScreenBackground\" value=\"${{ github.event.inputs.splash_color }}\" />\n    <preference name=\"ErrorUrl\" value=\"offline.html\" />\n    <preference name=\"LoadUrlTimeoutValue\" value=\"10000\" />\n</widget>|g" config.xml
          
          cordova build android
          
      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9_-')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="App"; fi
          APK_PATH="app/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          mv "$APK_PATH" "./${SAFE_NAME}.apk"
          gh release create "v${{ github.run_id }}" "./${SAFE_NAME}.apk" -t "Build ${{ github.run_id }}" -n "Automated APK Build"
