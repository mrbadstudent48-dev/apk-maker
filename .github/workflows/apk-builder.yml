name: Generate APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      icon_url:
        description: 'App Icon URL'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Cordova
        run: npm install -g cordova
      - name: Create App
        run: |
          cordova create app com.webapk.app${{ github.run_id }} "${{ github.event.inputs.app_name }}"
          cd app
          cordova platform add android
          
          # লোগো ডাউনলোড
          wget -O icon.png "${{ github.event.inputs.icon_url }}"
          
          # URL এবং অন্যান্য সেটিংস কনফিগার করা
          sed -i 's|<content src="index.html" />|<content src="${{ github.event.inputs.url }}" />|g' config.xml
          
          # স্প্ল্যাশ স্ক্রিন, ফুল স্ক্রিন এবং অন্যান্য কাস্টম ফিচার ইনজেক্ট করা
          sed -i 's|</widget>|    <icon src="icon.png" />\n    <allow-navigation href="*" />\n    <preference name="Fullscreen" value="true" />\n    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="icon.png" />\n    <preference name="AndroidWindowSplashScreenBackground" value="#FFFFFF" />\n    <preference name="Orientation" value="portrait" />\n    <preference name="DisallowOverscroll" value="true" />\n</widget>|g' config.xml
          
          # অ্যাপ বিল্ড করা
          cordova build android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
