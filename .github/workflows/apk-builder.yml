name: Generate APK
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      app_name:
        required: true
      icon_url:
        required: true
      package_name:
        required: true
      version:
        required: true
      splash_color:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Cordova
        run: npm install -g cordova
      - name: Create App
        run: |
          cordova create app "${{ github.event.inputs.package_name }}" "App"
          cd app
          cordova platform add android
          
          # InAppBrowser প্লাগিন
          cordova plugin add cordova-plugin-inappbrowser
          
          wget -O icon.png "${{ github.event.inputs.icon_url }}"
          
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>Loading</title>
            <script src="cordova.js"></script>
            <style>
              body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; background: #ffffff; text-align: center; }
              .icon { font-size: 70px; margin-bottom: 15px; }
              h2 { color: #333; margin: 0 0 10px; font-size: 22px; }
              p { color: #666; margin: 0 0 25px; padding: 0 20px; font-size: 15px; }
              button { background: #4f46e5; color: #fff; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
              .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
              @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
              #offline-screen, #loading-screen { display: none; flex-direction: column; align-items: center; }
            </style>
          </head>
          <body>
            
            <div id="loading-screen">
              <div class="loader"></div>
              <p style="margin-top:20px; color:#666; font-weight: bold;">Loading Experience...</p>
            </div>

            <div id="offline-screen">
              <div class="icon">📶❌</div>
              <h2>No Internet Connection</h2>
              <p>Please check your wifi or mobile data and try again.</p>
              <button onclick="launchApp()">Try Again</button>
            </div>

            <script>
              var targetUrl = "${{ github.event.inputs.url }}";
              var iabRef = null;

              function showOffline() {
                  document.getElementById('loading-screen').style.display = 'none';
                  document.getElementById('offline-screen').style.display = 'flex';
              }

              function showLoading() {
                  document.getElementById('loading-screen').style.display = 'flex';
                  document.getElementById('offline-screen').style.display = 'none';
              }

              function launchApp() {
                  showLoading();
                  
                  if (!navigator.onLine) {
                      setTimeout(showOffline, 500);
                      return;
                  }

                  // ফিক্স ১ ও ৩: hidden=yes (সাদা স্ক্রিন লুকাবে) এবং hideurlbar=yes
                  iabRef = cordova.InAppBrowser.open(targetUrl, '_blank', 'location=no,toolbar=no,zoom=no,hardwareback=yes,hidden=yes,hideurlbar=yes');

                  // ফিক্স ২: ওয়েবসাইট ১০০% লোড হওয়ার পর ধুপ করে স্ক্রিনে আসবে (সাদা পেজ আর থাকবে না)
                  iabRef.addEventListener('loadstop', function(event) {
                      iabRef.show();
                  });

                  iabRef.addEventListener('loaderror', function(event) {
                      iabRef.close();
                      showOffline();
                  });

                  // ফিক্স ৪: ইউজার ব্যাক বাটন চাপতে চাপতে ব্রাউজার কেটে দিলে, পুরো অ্যাপটাই সুন্দর করে এক্সিট হয়ে যাবে!
                  iabRef.addEventListener('exit', function(event) {
                      if (navigator.app) {
                          navigator.app.exitApp();
                      }
                  });
              }

              document.addEventListener('deviceready', function() {
                  launchApp();
              }, false);
            </script>
          </body>
          </html>
          EOF
          
          sed -i 's|<name>App</name>|<name>${{ github.event.inputs.app_name }}</name>|g' config.xml
          sed -i 's|version="1.0.0"|version="${{ github.event.inputs.version }}"|g' config.xml
          
          # ফুল-স্ক্রিন মোড আরো কড়াকড়িভাবে এনফোর্স করা হলো
          sed -i "s|</widget>|    <icon src=\"icon.png\" />\n    <allow-navigation href=\"*\" />\n    <preference name=\"Fullscreen\" value=\"true\" />\n    <preference name=\"HideKeyboardFormAccessoryBar\" value=\"true\" />\n    <preference name=\"AndroidWindowSplashScreenAnimatedIcon\" value=\"icon.png\" />\n    <preference name=\"AndroidWindowSplashScreenBackground\" value=\"${{ github.event.inputs.splash_color }}\" />\n</widget>|g" config.xml
          
          cordova build android
          
      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9_-')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="App"; fi
          APK_PATH="app/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          mv "$APK_PATH" "./${SAFE_NAME}.apk"
          gh release create "v${{ github.run_id }}" "./${SAFE_NAME}.apk" -t "Build ${{ github.run_id }}" -n "Automated APK Build"
