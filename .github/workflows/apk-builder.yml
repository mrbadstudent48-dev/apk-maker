name: Generate Native APK
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      app_name:
        required: true
      icon_url:
        required: true
      package_name:
        required: true
      version:
        required: true
      splash_color:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Pure Native Android Project
        run: |
          # প্যাকেজ নেম ডিরেক্টরি তৈরি করা (যেমন: com/mycompany/app)
          PKG_PATH=$(echo "${{ github.event.inputs.package_name }}" | tr '.' '/')
          
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # ১. গিটহাব থেকে অ্যাপের আইকন ডাউনলোড
          wget -O app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "${{ github.event.inputs.icon_url }}"
          
          # ২. অ্যান্ড্রয়েড সেটিংস ফাইল
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.1' } }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace '${{ github.event.inputs.package_name }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ github.event.inputs.package_name }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '${{ github.event.inputs.version }}'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          
          # ৩. ডায়নামিক স্প্ল্যাশ কালার যুক্ত করা
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashColor">${{ github.event.inputs.splash_color }}</color>
          </resources>
          EOF
          
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App.Splash" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@color/splashColor</item>
                  <item name="android:statusBarColor">@color/splashColor</item>
              </style>
              <style name="Theme.App.Main" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>
          EOF
          
          # ৪. অ্যান্ড্রয়েড মেনিফেস্ট (পারমিশন)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="${{ github.event.inputs.app_name }}" android:theme="@style/Theme.App.Splash">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # ৫. নেটিভ অফলাইন ডিজাইন (XML)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent">
              <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" />
              <LinearLayout android:id="@+id/offlineLayout" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:background="#FFFFFF" android:visibility="gone">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📶❌" android:textSize="70sp" />
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="No Internet Connection" android:textStyle="bold" android:textSize="22sp" android:textColor="#333333" android:layout_marginTop="16dp"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Please check your connection." android:textSize="16sp" android:textColor="#666666" android:layout_marginTop="8dp"/>
              </LinearLayout>
          </RelativeLayout>
          EOF
          
          # ৬. মেইন ব্রেইন (Java Logic)
          cat << 'EOF' > app/src/main/java/$PKG_PATH/MainActivity.java
          package ${{ github.event.inputs.package_name }};
          
          import android.content.Context;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkRequest;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private LinearLayout offlineLayout;
              private boolean isLoaded = false;
              private String targetUrl = "${{ github.event.inputs.url }}";
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  setTheme(R.style.Theme_App_Main); // স্প্ল্যাশ রিমুভ
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
          
                  webView = findViewById(R.id.webView);
                  offlineLayout = findViewById(R.id.offlineLayout);
          
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) { isLoaded = true; }
                  });
          
                  setupNetworkListener();
              }
          
              private void setupNetworkListener() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  NetworkRequest request = new NetworkRequest.Builder().addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET).build();
                  
                  cm.registerNetworkCallback(request, new ConnectivityManager.NetworkCallback() {
                      @Override
                      public void onAvailable(@NonNull Network network) {
                          runOnUiThread(() -> {
                              offlineLayout.setVisibility(View.GONE);
                              webView.setVisibility(View.VISIBLE);
                              if (!isLoaded) webView.loadUrl(targetUrl);
                          });
                      }
                      @Override
                      public void onLost(@NonNull Network network) {
                          runOnUiThread(() -> {
                              if (!isLoaded) { webView.setVisibility(View.GONE); offlineLayout.setVisibility(View.VISIBLE); }
                          });
                      }
                  });
                  
                  Network activeNetwork = cm.getActiveNetwork();
                  NetworkCapabilities caps = cm.getNetworkCapabilities(activeNetwork);
                  if (caps == null || !caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)) {
                      webView.setVisibility(View.GONE); offlineLayout.setVisibility(View.VISIBLE);
                  } else {
                      webView.loadUrl(targetUrl);
                  }
              }
          
              @Override
              public void onBackPressed() {
                  if (webView.getVisibility() == View.VISIBLE && webView.canGoBack()) { webView.goBack(); } 
                  else { super.onBackPressed(); }
              }
          }
          EOF

      - name: Build Pure Native APK
        run: gradle assembleDebug
        
      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9_-')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="App"; fi
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          mv "$APK_PATH" "./${SAFE_NAME}.apk"
          gh release create "v${{ github.run_id }}" "./${SAFE_NAME}.apk" -t "Build ${{ github.run_id }}" -n "Professional Native APK Build"
